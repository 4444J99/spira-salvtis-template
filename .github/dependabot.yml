version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      # TypeScript majors are breaking (compiler-API + new strictness) and need a
      # deliberate migration — a major auto-bump (5.9.x → 6.0) broke all CI on
      # main. Allow patch/minor; hold majors for manual upgrade.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-deps:
        patterns: ["*"]
